<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Re'born Spa Aesthetic — Subscribe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans:wght@300;400;500&display=swap');

  :root {
    --cream:   #F7F3EE;
    --linen:   #EDE7DC;
    --stone:   #C9BFB0;
    --moss:    #7A8C6E;
    --ink:     #2A2520;
    --rust:    #A0674A;
    --gold:    #B89B6A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--ink);
    font-family: 'Noto Sans KR', 'Noto Sans', sans-serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .wrap {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .logo-img {
    width: 56px;
    height: auto;
    margin-bottom: 22px;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 22px;
  }

  .eyebrow {
    font-family: 'Noto Sans', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    font-style: italic;
    color: var(--cream);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 10px;
    font-weight: 300;
    color: var(--stone);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .prompt {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-style: italic;
    color: var(--cream);
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .choice {
    display: block;
    border: 1px solid rgba(247,243,238,0.25);
    padding: 18px 24px;
    text-decoration: none;
    color: var(--cream);
    transition: background 0.25s, border-color 0.25s;
    text-align: left;
  }

  .choice:hover {
    background: rgba(247,243,238,0.06);
    border-color: var(--gold);
  }

  .choice-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .choice-lang {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
  }

  .choice-arrow {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .choice-sub {
    font-family: 'Noto Sans KR', 'Noto Sans', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: var(--stone);
    letter-spacing: 0.5px;
    margin-top: 6px;
  }

  .footer-note {
    margin-top: 40px;
    font-size: 10px;
    font-weight: 300;
    color: var(--stone);
    letter-spacing: 1px;
    line-height: 1.7;
  }
</style>
</head>
